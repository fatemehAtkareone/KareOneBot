[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "public"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

[functions."telegram-webhook"]
  timeout = 26

[functions."scheduled-daily-digest"]
  schedule = "0 5 * * *"

[functions."scheduled-due-soon"]
  schedule = "*/15 * * * *"

[functions."scheduled-overdue-sweep"]
  schedule = "0 * * * *"

[functions."scheduled-recurrence-spawner"]
  schedule = "*/10 * * * *"

[functions."scheduled-sla-watch"]
  schedule = "0 * * * *"

[dev]
  framework = "#static"
  port = 8888
  targetPort = 0

# SPA fallback so client-side routes (e.g. /webapp/tasks/42) load index.html
[[redirects]]
  from = "/webapp/*"
  to = "/webapp/index.html"
  status = 200
